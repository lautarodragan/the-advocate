  [2, 2, 2],
  [7, 8, 13],
  [4, 5, 10],
  [10, 11, 16],
  [19, 19, 22],
  [16, 16, 18],
  [16, 17, 22],
  [12, 13, 18],
  [1, 2, 7],
  [14, 14, 16],
  [24, 24, 26],
  [21, 21, 23],
  [27, 27, 28],
  [30, 30, 31],
  [22, 8, 3],
]

# Cuántas fusiones hicieron falta para llegar ahí, con
# `asignador.merge_least_visible`: cada una manda al color que menos
# se nota a su vecino más cercano.
fusiones = 227

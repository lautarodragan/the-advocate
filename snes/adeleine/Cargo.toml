[package]
name = "adeleine"
version = "0.1.0"
edition = "2021"
description = "Decides which colours a picture loses and how the ones left are grouped into palettes: the half of a graphics pipeline that changes what is seen"

[lib]
name = "adeleine"
path = "src/lib.rs"

[[bin]]
name = "adeleine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

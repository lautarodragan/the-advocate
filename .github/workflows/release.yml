# A release of every commit to `main` that passes CI: the tools compiled
# for each platform, so a machine without Rust —or without the time to
# build the workspace— downloads them and puts their `bin/` on the PATH.
#
# Each archive is `the-advocate/bin/` with the binaries,
# `the-advocate/runtime/` beside it, and the games' test harness where
# `just install` links it, `the-advocate/lib/advocate/harness/`: both travel
# with the tools, and a binary that does not find the checkout it was
# compiled from looks for them there —see `rm2k-snes/project/src/suite.rs`—;
# a game's tests look for the harness beside the `advocate` of their PATH.
# Until 2026-11-25 the harness went at its checkout's path,
# `the-advocate/rm2k-snes/harness/`. cc65 and the rest of what the README
# asks for are still the machine's. At its top go the licence, `LICENSE`,
# and what the LGPL asks for the snes_spc code the binaries carry:
# `NOTICE` and `LICENSE.snes_spc`.
#
# It follows CI instead of running beside it, so that a red commit is never
# released. The release is a draft until every platform has uploaded its
# archive: a build that fails leaves a draft, not a release with holes.
#
# There is no Windows build: Ditto and the cartridge's tools use
# `std::os::unix`.
#
# Every third-party action is pinned by its commit, with the tag beside it.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The same toolchain as CI's, for the same reasons: see `ci.yml`.
  RUST_TOOLCHAIN: 1.96.0
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha }}
  # One tag per run of CI: its number grows with every push, and the commit
  # is in the title.
  TAG: build-${{ github.event.workflow_run.run_number }}

jobs:
  draft:
    name: Draft the release
    # A push to `main` that passed: not a manual run, not a cancelled one.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Draft
        run: |
          short="${SHA:0:7}"
          subject="$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')"
          {
            echo "Built from $SHA: $subject"
            echo
            echo "Unpack it and put \`the-advocate/bin\` on the PATH. The tools still need \`ca65\` and \`ld65\` (cc65), \`python\` and a libretro core: see the README."
            echo
            echo "On macOS the binaries are not signed: \`xattr -dr com.apple.quarantine the-advocate\` after unpacking."
          } > notes.md
          gh release create "$TAG" --draft --target "$SHA" --title "$TAG ($short)" --notes-file notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc and not musl since 2026-10-31, when `rm2k-snes-audio
          # volume-ceilings` played the songs in a libretro core it loaded
          # with dlopen, which a static musl binary cannot do. That went on
          # 2026-11-28 —the ceilings are measured in `spc-dsp`, linked in—,
          # and nothing loads a library at run time any more, so musl would
          # work now; it stays glibc until someone has a reason to move.
          # Built on the oldest runner, so they run on any distribution with
          # a glibc at least that old (2.35).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          # Cross-compiled on the ARM runner, so it is not smoke-tested.
          - target: x86_64-apple-darwin
            runner: macos-15
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # Every binary of the workspace but xtask's, which generates Ditto's
      # schema and is not a tool: what `just install` installs.
      - name: Build
        run: cargo build --release --locked --workspace --exclude xtask --bins --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist/the-advocate/bin
          for bin in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name != "xtask") | .targets[] | select(.kind | index("bin")) | .name'); do
            cp "target/${{ matrix.target }}/release/$bin" dist/the-advocate/bin/
          done
          cp -R runtime README.md dist/the-advocate/
          # The licence, and what the LGPL asks of the binaries for the
          # snes_spc they carry, `spc-dsp`'s: its text, and a notice that
          # they contain it and where its source is. See that crate's
          # README.
          cp LICENSE snes/spc-dsp/NOTICE dist/the-advocate/
          cp snes/spc-dsp/vendor/snes_spc/license.txt dist/the-advocate/LICENSE.snes_spc
          mkdir -p dist/the-advocate/lib/advocate
          cp -R rm2k-snes/harness dist/the-advocate/lib/advocate/harness
          ls dist/the-advocate/bin
          archive="the-advocate-$TAG-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C dist the-advocate
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          echo "ARCHIVE=dist/$archive" >> "$GITHUB_ENV"

      # What a downloaded archive does: the checkout the binaries were
      # compiled from is not there —its runtime is moved away—, and they
      # find the runtime and the harness of the archive. `advocate build`
      # says where it found them in the file it leaves, `build/advocate.json`,
      # also when the build fails; and it fails here, on purpose: the
      # runners have no cc65, so `ca65` and `ld65` are stand-ins that fail,
      # and there is no SoundFont. The test game's dump is made as `just
      # game` makes it, in `test-game/justfile`, with the archive's
      # `advocate export` and `import`: the runners have no `just` either.
      # Until 2026-11-25 this asked `rm2k-snes-project`, and until
      # 2026-11-27 it ran `rm2k-sketch` and `ditto`.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/stand-ins" "$RUNNER_TEMP/empty"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/unpacked"
          bin="$RUNNER_TEMP/unpacked/the-advocate/bin"
          for tool in ca65 ld65; do
            printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/stand-ins/$tool"
            chmod +x "$RUNNER_TEMP/stand-ins/$tool"
          done
          (
            cd test-game
            mkdir -p build
            "$bin/advocate" export src build/game
            "$bin/advocate" import --game-dir build/game
          )
          mv runtime/main.s "$RUNNER_TEMP/main.s.away"
          PATH="$RUNNER_TEMP/stand-ins:$PATH" "$bin/advocate" build --project test-game \
            --game-dir "$RUNNER_TEMP/empty" --rtp-dir "$RUNNER_TEMP/empty" \
            --soundfont "$RUNNER_TEMP/empty/none.sf2" --without-tracks || true
          mv "$RUNNER_TEMP/main.s.away" runtime/main.s
          got="$(jq -r .suite.runtime test-game/build/advocate.json)"
          harness="$(jq -r .suite.harness test-game/build/advocate.json)"
          want="$(cd "$RUNNER_TEMP/unpacked/the-advocate/runtime" && pwd -P)"
          echo "runtime: $got"
          [ "$got" = "$want" ]
          want="$(cd "$RUNNER_TEMP/unpacked/the-advocate/lib/advocate/harness" && pwd -P)"
          echo "harness: $harness"
          [ "$harness" = "$want" ]

      - name: Upload
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256"

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest

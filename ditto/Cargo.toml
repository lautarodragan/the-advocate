[workspace]
members = [".", "xtask"]

[package]
name = "ditto"
version = "0.1.0"
edition = "2021"
description = "Lee los archivos de RPG Maker 2000 y los vuelca a JSON"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "lz2"
version = "0.1.0"
edition = "2021"
description = "LC_LZ2, the LZ format of first-party Super NES games, with an optimal parser"

[lib]
name = "lz2"
path = "src/lib.rs"

[[bin]]
name = "lz2"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

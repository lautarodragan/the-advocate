[package]
name = "rm2k-snes-map-background"
version = "0.1.0"
edition = "2021"
description = "An RPG Maker 2000 map's background for a Super Nintendo in mode 3: its two tile layers split over the lower half of colour memory and converted to tiles, and the map as a table of 16x16 blocks"

[lib]
name = "rm2k_snes_map_background"
path = "src/lib.rs"

[dependencies]
adeleine = { path = "../../snes/adeleine" }
rm2k-render = { path = "../../rm2k/rm2k-render" }
voodoo = { path = "../../snes/voodoo" }

[dev-dependencies]
ditto = { path = "../../rm2k/ditto" }
rm2k-rules = { path = "../../rm2k/rules" }
sha2 = "0.10"

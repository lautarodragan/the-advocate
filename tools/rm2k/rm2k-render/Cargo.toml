[package]
name = "rm2k-render"
version = "0.1.0"
edition = "2021"
description = "Draws an RPG Maker 2000 game's graphics the way RM2k draws them: the tile layers of a map and the other drawings of its ChipSet animation, the CharSet sheets its events are drawn with, and the faces, windows and pictures of its screens"

[lib]
name = "rm2k_render"
path = "src/lib.rs"

[[bin]]
name = "rm2k-render"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ditto = { path = "../ditto" }
rm2k-rules = { path = "../rules" }
image = { version = "0.25", default-features = false }
png = "0.17"
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

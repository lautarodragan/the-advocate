[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
description = "Generates a bytecode's constants for both of its sides from one declaration"

[[bin]]
name = "protocol"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

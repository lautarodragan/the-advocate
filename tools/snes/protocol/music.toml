  # the same, a different one for each side
  { name = "OP_SET_PAN_V0", code = 0x30, args = [{ name = "left", type = "byte" }, { name = "right", type = "byte" }] },
  { name = "OP_SET_PAN_V1", code = 0x31, args = [{ name = "left", type = "byte" }, { name = "right", type = "byte" }] },

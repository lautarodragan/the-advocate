  { name = "OP_NOTE_VOL_V4", code = 0x0C, args = [{ name = "volume", type = "byte" }, { name = "sound", type = "byte" }] },
  { name = "OP_NOTE_VOL_V5", code = 0x0D, args = [{ name = "volume", type = "byte" }, { name = "sound", type = "byte" }] },
  { name = "OP_NOTE_VOL_V6", code = 0x0E, args = [{ name = "volume", type = "byte" }, { name = "sound", type = "byte" }] },

  { name = "on_cancel", type = "byte" },
]
repeated = { name = "options", args = [
  { name = "window", type = "word" },
  { name = "destination", type = "word" },
] }

[[opcode]]
name = "OP_GOLD"
code = 0x15
args = [
  { name = "sign", type = "byte" },
  { name = "amount", type = "long" },
]

[[opcode]]
name = "OP_SAVE"
code = 0x16
args = []

[[opcode]]
name = "OP_VAR"
code = 0x17
args = [
  { name = "slot", type = "byte" },
  { name = "operation", type = "byte" },
  { name = "kind", type = "byte" },
  { name = "a", type = "word" },
  { name = "b", type = "word" },
]

[[opcode]]
name = "OP_IF_VAR"
code = 0x18
args = [
  { name = "slot", type = "byte" },
  { name = "kind", type = "byte" },
  { name = "comparison", type = "byte" },
  { name = "value", type = "word" },
  { name = "destination", type = "word" },
]

[[opcode]]
name = "OP_ITEM"
code = 0x19
args = [
  { name = "item", type = "word" },
  { name = "delta", type = "byte", signed = true },

  { name = "operation", type = "byte" },
  { name = "dx", type = "word", signed = true },
  { name = "dy", type = "word", signed = true },
  { name = "step", type = "byte" },
  { name = "wait", type = "byte" },
]

[[opcode]]
name = "OP_IF"
code = 0x12
args = [

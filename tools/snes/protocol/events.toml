repeated = { name = "frames", args = [
  { name = "cell", type = "byte" },
  { name = "x", type = "byte" },
  { name = "y", type = "byte" },
  { name = "palette", type = "byte" },
  { name = "tiles", type = "byte" },
  { name = "flip", type = "byte" },
  { name = "sound", type = "byte" },
  { name = "spare", type = "byte" },

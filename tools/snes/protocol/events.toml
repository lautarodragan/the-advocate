name = "event"

# The event bytecode: one entry per opcode, its number and its layout.
#
# This file is the source of truth for both ends of the contract — the
# compiler that emits the bytes and the interpreter that reads them — and it
# is owned by neither. What is generated from it, and where it lands, is the
# caller's business: see README.md.
#
# An instruction is its opcode byte followed by `args`, in order. An opcode
# that ends in a variable number of entries declares `repeated`, and the `arg`
# that holds how many entries follow carries `count = "<name of the group>"`.
# Those are the only two shapes there are. If a new opcode does not fit, the
# answer is to change the opcode, not to grow this grammar: the moment this
# file can describe behaviour, it stopped being a declaration.
#
# Types: `byte` (1), `word` (2, little endian), `long` (3, little endian).
# `signed = true` says how to read it back; nothing writes it differently.

[[opcode]]
name = "OP_DONE"
code = 0x00
args = []

[[opcode]]
name = "OP_SWITCH"
code = 0x01
args = [
  { name = "id", type = "word" },
  { name = "value", type = "byte" },
]

[[opcode]]
name = "OP_TELEPORT"
code = 0x02
args = [
  { name = "map", type = "word" },
  { name = "x", type = "word" },
  { name = "y", type = "word" },
]

[[opcode]]
name = "OP_DELAY"
code = 0x03
args = [
  { name = "frames", type = "word" },
]

[[opcode]]
name = "OP_TINT"
code = 0x04
args = [
  { name = "red", type = "byte" },
  { name = "green", type = "byte" },
  { name = "blue", type = "byte" },
  { name = "saturation", type = "byte" },
]

[[opcode]]
name = "OP_PARTY"
code = 0x05
args = [
  { name = "operation", type = "byte" },
  { name = "actor", type = "byte" },
]

[[opcode]]
name = "OP_ROUTE"
code = 0x06
args = [
  { name = "target", type = "byte" },
  { name = "frequency", type = "byte" },
  { name = "length", type = "byte", count = "commands" },
]
repeated = { name = "commands", args = [
  { name = "order", type = "byte" },
] }

[[opcode]]
name = "OP_MESSAGE"
code = 0x07
args = [
  { name = "offset", type = "word" },
]

[[opcode]]
name = "OP_WAIT_ROUTES"
code = 0x08
args = []

[[opcode]]
name = "OP_FLASH"
code = 0x09
args = [
  { name = "target", type = "byte" },
  { name = "red", type = "byte" },
  { name = "green", type = "byte" },
  { name = "blue", type = "byte" },
  { name = "power", type = "byte" },
  { name = "frames", type = "byte" },
]

[[opcode]]
name = "OP_TIMER"
code = 0x0A
args = [
  { name = "operation", type = "byte" },
  { name = "seconds", type = "word" },
  { name = "visible", type = "byte" },
]

# `PlayBGM`: the song, and how loud and how fast, already in the console's
# units. `left` and `right` are the gain of each side in 128ths —128 is the
# song as written—, which is RM2k's volume and balance together; `step` is
# how much of a music frame each video frame advances, in 256ths —256 is
# RM2k's tempo 100—.
[[opcode]]
name = "OP_BGM"
code = 0x0B
args = [
  { name = "track", type = "byte" },
  { name = "left", type = "byte" },
  { name = "right", type = "byte" },
  { name = "step", type = "word" },
]

[[opcode]]
name = "OP_PLACE"
code = 0x0C
args = [
  { name = "target", type = "byte" },
  { name = "x", type = "word" },
  { name = "y", type = "word" },
]

[[opcode]]
name = "OP_SWAP"
code = 0x0D
args = [
  { name = "first", type = "byte" },
  { name = "second", type = "byte" },
]

[[opcode]]
name = "OP_SHAKE"

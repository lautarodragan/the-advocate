[package]
name = "rm2k-snes-cartridge"
version = "0.1.0"
edition = "2021"
description = "Builds an rm2k-snes game's cartridges: bank packing, ca65 + ld65, checksum, symbols, and how much space is left"

[lib]
name = "cartridge"
path = "src/lib.rs"

[[bin]]
name = "rm2k-snes-assemble"
path = "src/bin/assemble.rs"

[[bin]]
name = "rm2k-snes-space"
path = "src/bin/space.rs"

[[bin]]
name = "rm2k-snes-cartridges"
path = "src/bin/cartridges.rs"

[dependencies]
clap = "4"
rm2k-project = { path = "../project" }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

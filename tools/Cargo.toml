# The Rust projects of the suite, as one Cargo workspace. They are still
# separate projects —each one is installed on its own with `cargo install
# --path <crate>`, and each one could be published on its own—; the workspace
# only makes the dependencies they share compile once, into one `target/`,
# and resolve to one version, in one `Cargo.lock`.
#
# `rm2k/ditto/xtask` is Ditto's schema generator: a member because a workspace
# cannot nest another one, and Ditto had its own for it.
[workspace]
members = [
    "snes/adeleine",
    "snes/gunter",
    "snes/lz2",
    "snes/protocol",
    "snes/resample",
    "snes/voodoo",
    "rm2k/ditto",
    "rm2k/ditto/xtask",
    "rm2k/rules",
    "rm2k/rm2k-render",
    "rm2k-snes/battle",
    "rm2k-snes/cartridge",
    "rm2k-snes/events",
    "rm2k-snes/map-background",
    "rm2k-snes/map-sprites",
    "rm2k-snes/maps",
    "rm2k-snes/patches",
    "rm2k-snes/project",
    "rm2k-snes/rm2k-snes-audio",
    "rm2k-snes/screens",
    "rm2k-snes/text",
]
# A virtual manifest has no edition to take the resolver from, and would fall
# back to the old one. "2" is what every member, on edition 2021, used alone.
resolver = "2"

# The profiles live here because Cargo ignores a member's and warns about it.
# Every project used these four.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Ditto and protocol optimized for size. Their `panic = "abort"` did not come
# along: Cargo does not allow `panic` per package, and unwinding changes how
# big the binaries are, not what they do.
[profile.release.package.ditto]
opt-level = "z"

[profile.release.package.protocol]
opt-level = "z"

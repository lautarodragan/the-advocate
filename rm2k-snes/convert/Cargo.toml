[package]
name = "rm2k-snes-convert"
version = "0.1.0"
edition = "2021"
description = "Converts an rm2k-snes game into a Super Nintendo cartridge's data: it asks each stage of the conversion what it needs, in order, and hands each one what the others answered"

[[bin]]
name = "rm2k-snes-convert"
path = "src/main.rs"

[dependencies]
clap = "4"
ditto = { path = "../../rm2k/ditto" }
png = "0.17"
rm2k-project = { path = "../project" }
rm2k-rules = { path = "../../rm2k/rules" }
# To read a picture as RM2k does, for the parts of the drawings that share
# a number: see `map_pictures`.
rm2k-render = { path = "../../rm2k/rm2k-render" }
# The opcodes and their sizes, to walk a compiled page.
rm2k-snes-bytecode = { path = "../bytecode" }
# Which members of a troop the battle carries: its `fit`.
rm2k-snes-battle = { path = "../battle" }
# The command codes; and how the compiler reads a map, which this reads the
# same way.
rm2k-snes-events = { path = "../events" }
# The pictures, a stage the converter calls as functions.
rm2k-snes-images = { path = "../images" }
# The engine's numbers, the VRAM layouts and the console's formats —a tile,
# a colour, an LZ2 stream—: the emission's, which publishes them.
rm2k-snes-mapdata = { path = "../mapdata" }
# What the converter decided to lose, written down: the patches next to the
# ROM.
rm2k-snes-patches = { path = "../patches" }
rm2k-snes-screens = { path = "../screens" }
# The music, `rm2k-snes-audio cartridge`, a stage the converter calls as a
# function.
rm2k-snes-audio = { path = "../rm2k-snes-audio" }
rm2k-snes-text = { path = "../text" }
# A whole map: Wally's `map` stage, called once per map.
wally = { path = "../wally" }
# What a stage answers, and a picture's key, read as types; the cache
# keeps the answers as JSON. And a stage answer read as the type of what
# takes it: `emit::typed`.
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a request's keys go in the order they are written, as
# they always went, and an object read from a stage's answer or from the
# project keeps its order on the way to the next.
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[package]
name = "rm2k-snes-cartridge"
version = "0.1.0"
edition = "2021"
description = "Builds an rm2k-snes game's cartridges: bank packing, ca65 + ld65, checksum, symbols, and how much space is left"
license.workspace = true

[lib]
name = "cartridge"
path = "src/lib.rs"

[dependencies]
ditto = { path = "../../rm2k/ditto" }
rm2k-project = { path = "../project" }
rm2k-rules = { path = "../../rm2k/rules" }
rm2k-snes-bytecode = { path = "../bytecode" }
# The converter and the MSU-1 tracks, called as libraries: the build runs
# no tool of ours. Until 2026-11-25 both were run from the PATH.
rm2k-snes-convert = { path = "../convert" }
rm2k-snes-audio = { path = "../rm2k-snes-audio" }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[lints]
workspace = true

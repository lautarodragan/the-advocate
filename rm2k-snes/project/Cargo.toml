[package]
name = "rm2k-project"
version = "0.1.0"
edition = "2021"
description = "Finds an rm2k-snes project, reads its settings, and knows where the machine's things are; and all that as JSON, for whoever is not a tool"

[lib]
name = "rm2k_project"
path = "src/lib.rs"

[dependencies]
clap = "4"
# `preserve_order`, like `toml`'s: the settings come out in the order the
# file writes them.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# To unpack a `.zip` game or RTP: see `src/archive.rs`.
flate2 = "1"
# `preserve_order`: a table's keys come back in the order the file writes
# them. The cartridges are built and printed in that order.
toml = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

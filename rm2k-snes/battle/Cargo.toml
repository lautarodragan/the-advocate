[package]
name = "rm2k-snes-battle"
version = "0.1.0"
edition = "2021"
description = "An rm2k-snes game's battle: its tables, its model and text screen, and the battle played turn by turn"

[lib]
name = "rm2k_snes_battle"
path = "src/lib.rs"

[[bin]]
name = "rm2k-snes-battle"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ditto = { path = "../../rm2k/ditto" }
rm2k-rules = { path = "../../rm2k/rules" }
rm2k-snes-text = { path = "../text" }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[package]
name = "advocate"
version = "0.1.0"
edition = "2021"
description = "Builds an rm2k-snes game: its cartridges from its advocate.toml, the converter and the assembler called as libraries, and a file in its build/ with everything a test suite needs to know; and imports an RPG Maker game into its dump, and back"

[[bin]]
name = "advocate"
path = "src/main.rs"

[dependencies]
# The cartridges: which ones the project declares, the fingerprint, the
# converter and the assembler they call, the space each one has left.
rm2k-snes-cartridge = { path = "../cartridge" }
clap = "4"
# `import` and `export`: the game in RPG Maker's format into the dump, and
# back.
ditto = { path = "../../rm2k/ditto" }
rm2k-project = { path = "../project" }
# The versioned patches, compared on every build and written with
# `--write-patches`.
rm2k-snes-patches = { path = "../patches" }
# `preserve_order`: the file keeps the order of the project file's tables,
# as `rm2k-snes-project` printed them.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

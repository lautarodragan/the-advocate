# The showcase, map 3: the Exterior ChipSet's first ninety-six lower tiles,
# one each, and its forty upper tiles with the most colours, above the hero
# —its ChipSet entry, 2 in `db/chipsets.json`, has every upper tile ★—,
# the rest grass. No game draws a map like this; it is as much as the
# biggest VRAM layout takes —384 tiles behind the hero and 256 in front—
# and the map where the console loses too much: the background has more
# colours than its budget, and the layer above is left a single palette of
# fifteen. The book's "The tools" shows what that looks like. The legend is
# generated, one character per piece; `Map0003.json` says the same 20x15,
# and the case `showcase` teleports there.


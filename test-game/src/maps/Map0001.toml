# The meadow's two tile layers, sketched: one character per cell, and the
# legend says which tile of the Exterior ChipSet goes in each layer. It is
# made into `Map0001.tiles` by `rm2k-sketch`; the map's size, its events and
# the rest are in `Map0001.json`, which has to say the same 20x15.
#
# The ChipSet's own tables —which upper tile lets the hero through, which
# is drawn above them— are in `db/chipsets.json`.

grid = '''
####################
#..T.........*..T..#
#..t............t..#
#.....*............#
#..................#
#.......*.....*....#
#..................#
#..................#
#...*..............#
#............*.....#
#..................#
#..T...........T...#
#..t.....*.....t...#
#..................#
####################
'''

[legend]
# The field: terrain autotile 0, the light grass, in its plain middle
# pattern. Every cell has it below.
"." = { lower = 4000 }
# A green bush, which does not let the hero through.
"#" = { lower = 4000, upper = 10007 }
# A tree: its crown, drawn above the hero, and its trunk, which blocks.
"T" = { lower = 4000, upper = 10002 }
"t" = { lower = 4000, upper = 10008 }
# Flowers, walked over.
"*" = { lower = 4000, upper = 10018 }

# The garden, map 2: the meadow's grass with a path, a fence around a well
# and, above the hero, two roofs, a dome and a tent. The ChipSet's ★ in
# `db/chipsets.json` puts those on the layer in front of the hero, which
# on the console is 4 bits a pixel with a palette per cell, so they are
# what Adeleine groups and merges: it is the map that loses a reasonable
# amount —see the book's "The tools", the lossy examples—. `Map0002.json`
# says the same 20x15, and the case `garden` teleports there.

grid = '''
####################
#..T.....AB..CD..T.#
#..t.....EI..GH..t.#
#.........::.......#
#..P......::..JKL..#
#.........::..MNO..#
#..ffffff.::.......#
#..f*..*f.::..F....#
#..f..W.f.::.......#
#..ffffff.::..QRS..#
#..........::.UVX..#
#..*...o...::..$...#
#..T.....q..::.T...#
#..t.....*...::t...#
####################
'''

[legend]
# The grass, as in the meadow: terrain autotile 0 in its plain pattern.
"." = { lower = 4000 }
# A bush, a tree's crown and trunk, and flowers, as in the meadow.
"#" = { lower = 4000, upper = 10007 }
"T" = { lower = 4000, upper = 10002 }
"t" = { lower = 4000, upper = 10008 }
"*" = { lower = 4000, upper = 10018 }
# A dirt path.
":" = { lower = 5072 }
# A fence around the well, and the pieces behind the hero with the most
# colours: the well and the flower pot, with sixteen each, the fountain,
# the sign, a stone and a barrel. Behind the hero they go in the 8-bit
# background, which has no palette per cell.
"f" = { lower = 4000, upper = 10024 }
"W" = { lower = 4000, upper = 10055 }
"P" = { lower = 4000, upper = 10021 }
"F" = { lower = 4000, upper = 10104 }
"$" = { lower = 4000, upper = 10020 }

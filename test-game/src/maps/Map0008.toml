# The ring's two tile layers, sketched like the meadow's —see `Map0001.toml`—.
# The map is `Map0008.json`, and what makes it worth a map is there: it
# loops on both axes, so the hero, the two walkers and the camera go across
# its edges to the other side. `tests/test_wrap.py` says what is tested.
#
# Its edges are open on purpose, so that every seam lets one through, and
# four lanes are clear of anything: row 4, where the leftward walker goes;
# column 20, the upward one's; and row 10 and column 12, the hero's. The
# trees, bushes and flowers elsewhere are landmarks, so that a capture
# across a seam shows which side is which.

grid = '''
....*...........*.......
..T..........*..........
..t....*..........#.....
........................
........................
......*.............*...
...#...........*........
................T.....#.
................t.......
....*...................
........................
.........*..............
..##.................*..
......T..........*......
......t.................
...*..........*.........
'''

[legend]
# The field: terrain autotile 0, the light grass, in its plain middle
# pattern. Every cell has it below.
"." = { lower = 4000 }
# A green bush, which does not let the hero through.
"#" = { lower = 4000, upper = 10007 }
# A tree: its crown, drawn above the hero, and its trunk, which blocks.
"T" = { lower = 4000, upper = 10002 }
"t" = { lower = 4000, upper = 10008 }
# Flowers, walked over.
"*" = { lower = 4000, upper = 10018 }

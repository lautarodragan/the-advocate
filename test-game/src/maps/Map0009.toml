# The terrace's two tile layers, sketched like the meadow's —see
# `Map0001.toml`—. The map is `Map0009.json`: a slab of grass hanging in
# the night sky, which is its panorama, `Stars`, scrolling on its own.
# `tests/test_terrace.py` says what is tested.
#
# The sky is where the lower layer draws nothing: the ChipSet's last lower
# tile, 5143, is all transparent. It is left on purpose where a box in the
# middle of the screen writes —rows 5 to 9—: left of the slab, where the
# box's lines start, and in a hole in the slab's middle, so that its
# letters go over the moving panorama, over the floor and over the walkers
# who cross its lines. The map is wider than the screen and the hero stands
# at (10, 12), so the camera is inside the map and not against an edge, as
# on A Blurred Line's map 1, the case this one keeps. The two trees' crowns
# are drawn above the hero, which makes the map flattened, as that one is.

grid = '''
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
~~~~~~~~~T..........T~~~~~~~~~
~~~~~~~~~t..........t~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~....~~~~....~~~~~~~~~
~~~~~~~~~....~~~~....~~~~~~~~~
~~~~~~~~~....~~~~....~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~............~~~~~~~~~
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
'''

[legend]
# The sky: the transparent lower tile, so the panorama shows.
"~" = { lower = 5143 }
# The floor: terrain autotile 0, the light grass, in its plain middle
# pattern.
"." = { lower = 4000 }
# A tree: its crown, drawn above the hero, and its trunk, which blocks.
"T" = { lower = 4000, upper = 10002 }
"t" = { lower = 4000, upper = 10008 }

[pytest]
# The test game's tests: they run its cartridge, so they need it built
# —`just test` in `test-game/` builds it first— and a libretro core. The
# harness is the tools' generic one, `rm2k-snes/harness/`, named here by
# its place in this repository: a port's tests import the one `just
# install` installed, but the test game is tested with its own checkout's.
pythonpath = . ../../rm2k-snes/harness
testpaths = .

# The test game's project, read by the tools like a port's: what each key
# means is in `LAYOUT.md`, "What the game decides: the project file", and in
# the tools that read it.
#
# Unlike a port, the game is not somebody else's: `src/` is written by hand,
# `just game` makes the RM2k files out of it into `build/game/` —that is the
# `--game-dir`— and dumps them back to `build/data/`, which is what the
# converter reads, the same path as a port's dump. See `README.md`.

[paths]
data = "build/data"
patches = "patches"
build = "build"
cases = "cases"

[rom]
name = "test-game"
title = "TEST GAME"
sram_signature = "TEST"
msu_data_signature = "TESD"

[maps]
below = 90
excluded = []
added = []
test = []

# The tools demand a cartridge called `release` with every case: here only
# `nothing`, the game as it boots. What used to be cases is played, from the
# meadow's tester —see `hub.toml`—, and `terrace` is `test-vblank`'s alone,
# the same teleport as the guide's.
# `--no-title`: the game has no title picture, and starts on its map.
[cartridges.release]
start_map = 1
party = []
maps = "game"
test_graphics = []
flags = ["--no-title"]
cases = "all"
excluded_cases = ["terrace"]

# The terrace, map 9, with `--vblank-probe`: the ROM leaves in RAM on which
# vblank line each of the message window's lines went up, how late its
# writes ended and whether the screen went into forced blank, which
# `tests/test_terrace.py` reads. A cartridge apart because the ROM that gets
# played does not carry the probe —it costs every vblank a few lines—; the
# clearing, map 4, is only somewhere to start.
[cartridges.test-vblank]
start_map = 4
party = []
maps = [4, 9]
test_graphics = []
flags = ["--no-title", "--vblank-probe"]
cases = ["terrace"]
excluded_cases = []

[debug]
debug_map = false
enemy_hp = false
# The pause menu's debug screen, RM2k's F9: off, so that one project of the
# tools builds without it.
debug_screen = false
# Select walks the hero through walls and events, RPG_RT's test play's
# Ctrl: off, like the debug screen.
phasing = false

[cases]
real_game = "nothing"
debug_map_entry = "debug-map"

[graphics]
opaque = []
timer_never_runs_in = []
# The lantern's night mask, map 5, drawn into the map: see
# `tests/test_map_picture.py`.
map_pictures = true
# The still events that change pose, drawn into the background a block per
# pose: only on the anvil, map 15, whose crate is one —see
# `tests/test_animation_flash.py`—.
baked_events = [15]

[graphics.palette_weight]

[graphics.cropped_pictures]

[text]
font = "low-variable"

[music]
jumps_that_never_happen = []
apart_themes = []
effect_slots_of_first_copies = 0

[events]
counters = []

[menus]

[sound_effects]
paid_by_music = []
per_map = []
route_effects_left_out = []
troop_effects_in_package = []

[sound_effects.whole]

# The game has no battles yet, so no backdrop is ever drawn; the key is
# required all the same, and names none of the game's.
[battle]
fallback_backdrop = "none"

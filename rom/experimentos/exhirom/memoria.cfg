# Los 32 KB del código, vistos desde $80:8000. `armar.py` los pone dos veces
# en el archivo de 8 MB —en $008000 y en $408000— y llena el resto con los
# bytes que la ROM compara: ver el encabezado de `prueba.s`.
MEMORY {
    ZP:     start = $0000,   size = $0100,  type = rw;
    ROM0:   start = $808000, size = $8000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = ROM0, type = ro, start = $80FFC0;
    VECTORS:  load = ROM0, type = ro, start = $80FFE0;
}

# LoROM de 128 KB, FastROM: el código en el banco $80 y los datos en los
# tres siguientes. `armar.py` reparte los bloques en BANCO1..BANCO3, y con
# más pantallas arma uno igual con más bancos: éste es el de muestra, y lo
# que no son los bancos lo toma de acá.
MEMORY {
    ZP:     start = $0000,   size = $0100,  type = rw;
    ROM0:   start = $808000, size = $8000, fill = yes, fillval = $FF;
    ROM1:   start = $818000, size = $8000, fill = yes, fillval = $FF;
    ROM2:   start = $828000, size = $8000, fill = yes, fillval = $FF;
    ROM3:   start = $838000, size = $8000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = ROM0, type = ro, start = $80FFC0;
    VECTORS:  load = ROM0, type = ro, start = $80FFE0;
    BANCO1:   load = ROM1, type = ro, optional = yes;
    BANCO2:   load = ROM2, type = ro, optional = yes;
    BANCO3:   load = ROM3, type = ro, optional = yes;
}

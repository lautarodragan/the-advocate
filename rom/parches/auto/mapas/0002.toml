# The artistic decisions of map 2: what is lost when taking it to the
# SNES. The converter writes it and `just parches` regenerates it,
# which is what has to be run when a change moves it; `just parches
# --check` —and the suite— fail if it is stale. See `rm2k-snes-patches`.

mapa = 2
nombre = "Linkage Block"

[capas.fondo]
# How many distinct colors the drawing brought and how many
# CGRAM entries the upper layer left it.
colores = 60
presupuesto = 71
# Each merge sends color `de` to color `a`, in 15-bit RGB, and
# `pixeles` is how many it moved when it was decided. They go **in
# order**: applying them top to bottom rebuilds the whole mapping.
fusiones = []

[capas.encima]
# Each merge sends color `de` to color `a`, in 15-bit RGB, and
# `pixeles` is how many it moved when it was decided. They go **in
# order**: applying them top to bottom rebuilds the whole mapping.
fusiones = [
  { de = [5, 5, 5], a = [4, 4, 4], pixeles = 6 },
  { de = [3, 8, 9], a = [3, 8, 10], pixeles = 56 },
  { de = [6, 12, 13], a = [6, 13, 14], pixeles = 13 },
  { de = [13, 13, 13], a = [12, 12, 12], pixeles = 30 },
  { de = [1, 3, 7], a = [3, 3, 3], pixeles = 13 },
  { de = [3, 6, 2], a = [4, 7, 3], pixeles = 60 },
  { de = [3, 3, 3], a = [2, 2, 2], pixeles = 175 },
  { de = [6, 6, 6], a = [7, 7, 7], pixeles = 196 },
  { de = [6, 13, 14], a = [5, 11, 12], pixeles = 65 },
  { de = [14, 14, 14], a = [12, 12, 12], pixeles = 70 },
  { de = [3, 8, 10], a = [4, 9, 10], pixeles = 588 },
  { de = [22, 10, 7], a = [20, 9, 6], pixeles = 333 },
  { de = [7, 7, 7], a = [8, 8, 8], pixeles = 644 },
]

# El archivo de proyecto de A Blurred Line: lo que este juego decide y las
# herramientas no. Qué mapas y qué casos lleva cada cartucho, cómo se llama la
# ROM, qué efectos de sonido van enteros. Lo lee la suite `rm2k-snes-*`, y una
# clave que falta es un error: ninguna herramienta tiene un valor por omisión
# para lo que está acá.
#
# Las claves van en inglés, porque son la interfaz de las herramientas y van a
# ser las de cualquier juego; los comentarios, en castellano, porque el archivo
# es de ABL. Lo que protege un valor —por qué ese mapa sale, por qué ese efecto
# va a esa tasa— va como comentario al lado del valor.
#
# Lo que **no** va: dónde está el juego en esta máquina —el RTP, el SoundFont—,
# que es del ambiente y no del proyecto; y los límites del motor que se
# midieron sobre ABL, que son supuestos del motor y se quedan en su código.


# --- Dónde está cada cosa ----------------------------------------------------
[paths]
# Relativas a este archivo. Las herramientas no saben cómo está armado el
# juego por dentro: lo leen de acá. Hasta el 2026-09-29 las sabía
# `common/project.py`, que es de las herramientas.
#
# Lo que no va: el runtime, que viaja con las herramientas; y lo que es sólo
# de las pruebas del juego —las goldens, lo que dejan para mirar—, que no lo
# lee ninguna herramienta y las pruebas lo saben por su propia ubicación.

# El juego volcado a JSON, que es lo que lee el conversor: `just datos`.
data = "data"

# Lo que se decidió sobre el juego: `manual/`, lo rediseñado a mano, y
# `auto/`, lo que decidió el conversor y se versiona.
patches = "parches"

# Todo lo que se arma, y nada versionado: un directorio por cartucho, el
# caché, lo que miden `techos` y los ChipSets del fork.
build = "build"

# Los casos de la tanda, un JSON por caso. Es de las pruebas, pero lo lee
# `rm2k-snes-cartridges`, que los mete en las páginas de prueba de cada
# cartucho.
cases = "pruebas/casos"

# --- La ROM ------------------------------------------------------------------
[rom]
# El nombre de los archivos: `abl.sfc`, y al lado `abl.msu` y las pistas
# `abl-N.pcm`, que el MSU-1 busca por el nombre del `.sfc`.
name = "abl"

# El título de la cabecera: lo que muestra el menú del FX Pak y lo que lee
# cualquier base de datos de ROMs. Hasta 21 caracteres ASCII, y se rellena con
# blancos. Decía "ABL SNES MUSIC POC" hasta el 2026-09-09, de cuando esto era
# una prueba de audio; en hardware se ve, así que dejó de dar igual.
title = "A BLURRED LINE"

# La firma con que la SRAM dice que una ranura tiene una partida de este juego:
# cuatro caracteres ASCII. **Cambiarla invalida las partidas guardadas**: una
# ranura con otra firma se ve vacía.
sram_signature = "ABLS"

# La firma del `.msu` de datos —los fondos de batalla que la ROM lee por el
# MSU-1—: cuatro caracteres ASCII al principio de la cabecera del archivo.
msu_data_signature = "ABLD"

# --- Los gráficos ------------------------------------------------------------
[graphics]
# Los que se dibujan **opacos aunque su página diga translúcida**. Es una
# divergencia deliberada de RM2k, decidida por taro el 2026-09-12.
#
# Por ahora hay uno solo, el save point. Se probaron los dos caminos para
# dibujarlo semitransparente y los dos se cayeron: con la trama en una pantalla
# moderna se ve el damero, y con el color math de la consola —que es
# transparencia de verdad— el objeto deja de animar y el héroe se ve **a
# través** del save point. taro eligió el tercero: opaco, sprite, animando, y
# con su paleta de verdad. Lo que hace que valga la pena es que ahora la tiene:
# contando sólo las poses que muestra son trece colores y le sobra lugar en una
# paleta propia, mientras que antes pedía prestada la de otro y salía gris.
#
# Por nombre de CharSet, sin distinguir mayúsculas.
opaque = ["savept"]

# Cuando un mapa tiene más personajes que paletas de sprite, el que llega
# último **no se queda sin dibujar**: se le presta una ajena y se lo dibuja con
# los colores de otro. Quién llega último era el orden de los eventos del mapa,
# o sea el azar: en Lashe City el save point es el evento 66 de 68 y por eso
# salía con la paleta de otro. taro lo describió como "en algún momento perdió
# uno o dos colores y pasó de azul/celeste/blanco a gris", y no era la fusión:
# era que no tenía paleta propia.
#
# Así que un CharSet puede pesar, y el que pesa se sirve primero; el que no
# está, pesa 0. Es una tabla escrita a mano y corta a propósito: no hay una
# medida automática de "cuánto se ve" que no sea inventarse una —un evento
# decorativo puede estar en pantalla todo el juego y un personaje central
# aparecer un minuto—, y una tabla de dos renglones se revisa de un vistazo. Lo
# que la llena es lo que taro reporta jugando.
[graphics.palette_weight]
# El save point: está en cada ciudad, es con lo que se guarda la partida, y su
# azul contra el blanco del brillo es todo lo que tiene.
savept = 2
# Los cuatro de Future1 —Talan, Core, Manta, Kersh—. Casi siempre son líderes,
# y al líder ya se le fuerza paleta; esto los cubre en los mapas donde además
# andan como NPC.
Future1 = 1


# --- La pelea ----------------------------------------------------------------
[battle]
# El fondo de las peleas cuyo fondo no está en la ROM: una tropa que pelea con
# el fondo "del lugar" en un mapa sin encuentros al azar. Es el de los Rat
# Tracks, una cueva de roca gris, porque no dice dónde se está: el del droide
# es una sala con un monitor y la Tierra en una pantalla, y el de los Back
# Alleys una calle con carteles. Una pelea en el bosque sobre roca se ve rara;
# sobre una nave, equivocada. Lo piden los encuentros de los Rat Tracks, así
# que en `release` no cuesta nada. No negro, porque "negro confunde", de taro.
fallback_backdrop = "ABLBackdropSJ08"


# --- La música ---------------------------------------------------------------
[music]
# Los saltos de páginas compiladas que no se pueden dar, como [mapa, destino].
# La herencia de temas entre mapas no mira condiciones, y un salto que nunca
# pasa le hace reservar lugar a un tema que nunca llega, a costa de los que sí.
#
# El 45 es el video de seguridad: el 19 copiado entero, con sus eventos. Su
# página automática corre la escena del director apenas se entra y se va al
# 40; el evento 4, que salta al 20, es el del 19 que vino con la copia, y
# cuando el jugador podría tocarlo ya prendió el switch que lo apaga. Contado,
# `Kfmus5` —que llega sonando al 45 por los vidcasts— heredaba en el 20 y le
# bajaba cuatro golpes a `Lunar_Pyramid` y `wb3shop`, de 22 a 14 kHz.
jumps_that_never_happen = [[45, 20]]

# **Los temas aparte**: un tema aparte no va con los otros temas del paquete
# de su mapa: lo sube su `PlayBGM`, **él solo con los efectos del paquete**, y
# lo demás se suelta hasta el próximo `PlayBGM`. Tampoco se lo hereda a los
# mapas a los que se sale de ahí. Es un tema de salida que no se va, y por eso
# lo dice esta lista y no una regla: que nunca suene al mismo tiempo que los
# otros temas del mapa, ni al salir, lo sabe quien leyó las páginas.
apart_themes = [
    # `vswar` en el 38 y el 47, del 2026-09-27: es el de las escenas del HQ y
    # de los guardias, y solo ocupa 61 KB a la tasa que tenía antes de Lashe
    # City, así que con `golden_axe-turtlevillage2` al lado —el otro tema de
    # esos dos mapas— y `cd4`, que llega sonando del 10, el paquete pedía 82 KB
    # y bajaban 47 pares (tema, instrumento), los de afuera por las copias que
    # ya no se podían hacer. En los dos la escena lo cambia a `golden_axe`
    # antes de irse: en el 47 en la misma página, y en el 38 se entra al
    # basural por un `Teleport` y se sale por otro que antes prende
    # `golden_axe` (los eventos 20, 21 y 26). Lo que cuesta es la carga: subir
    # vswar al empezar la escena, un cuadro y medio por KB. Los cofres del
    # basural (Bow2) suenan igual, porque los efectos del paquete se quedan.
    { map = 38, themes = ["vswar"] },
    { map = 47, themes = ["vswar"] },
]

# Hasta cuántas entradas del directorio de muestras llega la primera tanda de
# copias —las que taro escuchó—: las que ocupaban los efectos cuando cada uno
# tenía la suya, el 2026-09-26, los 92 de `release`. No son los efectos de hoy:
# contarlos hacía que cada efecto nuevo le sacara una copia a la primera tanda
# aunque no ocupara ninguna entrada, porque comparte lugar con los de otros
# paquetes. Así quedaron afuera Flash1 en el 13 y Earth4 en el 21, del
# 2026-09-27: con los dos, un golpe de `bubstix` bajaba de 19,3 a 13,9 kHz.
effect_slots_of_first_copies = 92

# --- Los eventos -------------------------------------------------------------
[events]
# Los contadores: un común que muestra una variable con dos imágenes de
# dígitos —decena y unidad—, que el compilador de eventos convierte en un
# opcode, con los dígitos del cronómetro, en vez de pegar su cuerpo en cada
# llamada. Ver `compile_counter` en `tools/rm2k-snes/events/`.
#
# Hoy es uno: la Fortitude de Eisen en el mapa 95, "Into The Machine". El
# común 9, `FortitudeDisplay`, dibuja la variable 48 con las imágenes 2 y 3
# —la unidad la elige el común 10 sobre la 49—, y se llama después de cada
# salto y cada escalera: treinta y una llamadas. Pegado, son 1.345 bytes cada
# una. Ver `workflow/tasks/*/el-contador-de-fortitude-no-se-ve.md`.
counters = [
    { common_event = 9, variable = 48 },
]

# --- Los efectos de sonido ---------------------------------------------------
[sound_effects]
# Los enteros que **sí** paga la música: los de `[sound_effects.whole]` que, si
# no entran en lo que la música deja libre en su paquete, le bajan la tasa a
# algún instrumento. Los demás enteros no pueden: si no entran, el conversor
# se corta.
paid_by_music = [
    # El trueno de la apertura: ver su tasa, abajo.
    "Thunder9@entero",
    # **Los que sí paga la música**, del 2026-09-26. taro, escuchando los que
    # no entraban en lo libre: *"tengo cero dudas de que tienen que tener su
    # longitud completa (todos)"*. Y después, con los números de subirlos a 11
    # kHz a la vista, que afectar tanto a la música no le agrada: van **enteros
    # a la tasa de siempre**, y a más sólo donde fuera gratis —no hubo ninguno:
    # cada uno está en algún paquete que limita muestras—. Los de tres cuartos
    # de segundo o menos ya sonaban enteros y no están acá.
    #
    # Enteros sí le cuestan a la música de su paquete —los tres largos de la
    # pelea al tema de batalla, los del mapa 3 a `evilrhys`; la lluvia no,
    # porque la paga el trueno de la apertura, que bajó de tasa—: cuánto y a
    # quién está en `tasks/*/efectos-de-sonido-sin-recortes.md`.
    "Rain1", "Bite", "Item2", "Monster1", "Thunder9", "Darkness",
    "Explosion4", "Glass", "Holy5",
]

# Los alias por mapa: el efecto que en ese mapa suena con otra muestra. Cada
# uno es un efecto más, pero no una entrada más del directorio: comparte lugar
# con los de los otros paquetes, así que sólo cuesta una si su paquete pasa a
# ser el más cargado. El `sample` lleva una `@`: lo que va después es un nombre
# aparte para la misma WAV.
per_map = [
    # El trueno de la apertura, entero: el 3, el 20 y el 32 también piden el
    # trueno y llevan el de siempre.
    { effect = "Thunder9", map = 1, sample = "Thunder9@entero" },
    # Earth4 en el 21, del 2026-09-27: lo pide una ruta de ahí, y dura 1,36 s,
    # así que sólo ahí va entero y a la tasa de su WAV —el del 3 sigue como
    # estaba—.
    { effect = "Earth4", map = 21, sample = "Earth4@entero" },
]

# Los mapas cuyos efectos de ruta —los que pide la orden 35 de una ruta
# forzada— **no entran** en el paquete de audio del mapa: `effects` es "all", o
# la lista de nombres. Un efecto de ruta suena igual si alguna página del mapa
# lo pide con `PlaySound`, porque entonces ya está en el paquete; los que sólo
# pide una ruta, no suenan.
#
# Es la regla de taro para los efectos —ningún instrumento pierde tasa por
# ellos— aplicada mapa por mapa, medida el 2026-09-27 contra el reparto de
# `release` (la tasa de cada par tema-instrumento, antes y después).
route_effects_left_out = [
    # Los nueve de la escena de `evilrhys` (Decision1, Blow1 a Blow6, Shot2) no
    # entran en su paquete **ni con las muestras al mínimo**: el conversor se
    # corta. Switch1 suena, porque las páginas también lo piden.
    { map = 3, effects = "all" },
    # Blow2 le baja un instrumento de `Deflector1` de 22,9 a 16,4 kHz.
    { map = 7, effects = "all" },
    # El `SceneDriver` pide cuatro, y con ellos `hzbreach` deja de ser tema de
    # salida y el paquete no entra.
    { map = 14, effects = "all" },
    # Es de prueba: Earth8 le baja 25 pares.
    { map = 121, effects = "all" },
]

# Los efectos de las páginas de tropa —su `PlaySound`— que **sí** entran en el
# paquete de audio de la pelea. Los demás no entran, por la misma regla de
# taro: ningún instrumento pierde tasa por un efecto. El paquete de la pelea
# es el tema de batalla y los efectos del sistema, y ya limita muestras:
# medido el 2026-09-28 contra el `release` de antes, el `Thunder9` del
# despegue de la pelea de los agentes (tropas 102 y 104) le baja a
# `T_VGFighterMAX_Masako` seis instrumentos de 13,6-14,1 a 11,5-11,7 kHz y el
# BRASS64 de 16,3 a 10,8. Con MSU-1 el tema suena por su pista y eso no se
# oye, pero el efecto tampoco: los efectos de calidad del `.msu` son los del
# paquete. Sumarlo acá lo hace sonar con los dos. Es una decisión de oído, como
# `paid_by_music`: ver `workflow/tasks/*/eventos-de-tropa-de-release.md`.
#
# El `Thunder9` entra, a los 6000 Hz de `[sound_effects.whole]`: taro escuchó
# el tema de batalla con y sin él, y a 6000 y a 3000 Hz, y eligió 6000 el
# 2026-09-28 (`tasks/*/el-hp-de-los-enemigos-y-el-trueno.md`). Además de lo de
# arriba bajan ocho muestras de la batería, y con MSU-1 los efectos de calidad
# de la pelea pasan de 14000 a 12000 Hz.
troop_effects_in_package = ["Thunder9"]

# Los que van enteros, sin tope ni bucle, a la tasa que dice cada uno, en Hz:
# terminan cuando termina la muestra, que es lo que hacen en RM2k. Con el
# tope, el trueno repetía sus 0,35–0,75 s hasta cumplir los cuadros y taro lo
# oyó tartamudear: `decisiones/el-trueno-va-entero-y-paga-la-lluvia.md`.
#
# **Lo que un efecto entero ocupa de más no le cuesta nada a la música**: el
# banco se reparte contando cada efecto como si no estuviera acá, y lo de más
# tiene que entrar en lo que la música deja libre en cada paquete donde está
# —si no, el conversor se corta—, salvo los de `paid_by_music`. Es de taro:
# *"No me parece aceptable que instrumentos pierdan calidad por un solo mapa,
# pero tampoco quiero perder calidad en los efectos de sonido."* Un efecto que
# está en un paquete que limita muestras —cuál limita a cada una lo imprime
# el conversor— no puede estar acá sin que algún instrumento lo pague, y eso
# lo decide taro escuchando: ver la tarea `efectos-de-sonido-sin-recortes.md`.
#
# La tasa de cada uno se eligió el 2026-09-26: los que más se oyen primero, a
# la más alta que entra —22.050 Hz es la de los WAV, así que no se
# remuestrean—, y sin que los efectos de un paquete que hoy entran al lado de
# un tema que puede venir sonando dejen de entrar (ver
# `decisiones/el-tema-que-suena-gana-y-los-efectos-esperan.md`).
[sound_effects.whole]
# El trueno de la apertura, que es un alias de `per_map`. **Sí** lo paga la
# música, si hace falta. Va a 8,8 kHz y no a los 22 de su WAV para que la
# lluvia entera entre en el paquete del mapa 1 sin bajarle la tasa a ningún
# instrumento: taro, el 2026-09-26. Subirlo vuelve a costarle a
# `escape_newyork`.
"Thunder9@entero" = 8800
Sword3 = 22050
Monster2 = 22050
Recovery4 = 22050
Flame5 = 22050
Explosion5 = 22050
Dark5 = 22050
Cold2 = 22050

Kill3 = 16000
Sword2 = 11025
Dark1 = 11025
Sword1 = 11025
Numbness3 = 6000
"Refer Book" = 6000
Earth1 = 6000
Thunder5 = 6000
# Los de `paid_by_music`, del 2026-09-26: enteros a la tasa de siempre.
Rain1 = 6000
Bite = 6000
Item2 = 6000
Monster1 = 6000
Thunder9 = 6000
Darkness = 6000
Explosion4 = 6000
Glass = 6000

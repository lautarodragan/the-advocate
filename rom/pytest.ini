[pytest]
# El arnés vive en `pruebas/arnes/` y las pruebas en una carpeta por lo que
# prueban, así que ninguna lo tiene al lado; y los paquetes del port se
# importan por su nombre con `tools/` en el camino —`from port import
# eventos`—, como dice `tools/README.md`. Los dos van acá y no en un
# `sys.path.insert` al principio de cada archivo: así vale igual para `just
# pruebas` que para un `pytest` suelto sobre un archivo solo.
#
# Lo que corre como script —`pruebas/arnes/video.py`— no pasa por pytest y se
# arma su camino él mismo.
pythonpath = pruebas/arnes ../tools

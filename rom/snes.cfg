# LoROM de 32 KB: un solo banco mapeado en $8000-$FFFF.
MEMORY {
    ZP:      start = $0000, size = $0100, type = rw;
    RAM:     start = $0100, size = $1F00, type = rw;
    ROM:     start = $8000, size = $7FC0, type = ro, fill = yes, fillval = $00;
    HEAD:    start = $FFC0, size = $0020, type = ro, fill = yes, fillval = $00;
    VECT:    start = $FFE0, size = $0020, type = ro, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE:     load = ROM,  type = ro;
    RODATA:   load = ROM,  type = ro;
    HEADER:   load = HEAD, type = ro;
    VECTORS:  load = VECT, type = ro;
    BSS:      load = RAM,  type = bss;
    ZEROPAGE: load = ZP,   type = zp;
}

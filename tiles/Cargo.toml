[package]
name = "tiles"
version = "0.1.0"
edition = "2021"
description = "Turns a picture into 8x8 tiles, palettes and a tilemap, packed the way a 4bpp/8bpp planar PPU wants them"

[lib]
name = "tiles"
path = "src/lib.rs"

[[bin]]
name = "tiles"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
png = "0.17"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

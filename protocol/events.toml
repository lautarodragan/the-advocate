# The event bytecode: one entry per opcode, its number and its layout.
#
# This file is the source of truth for both ends of the contract — the
# compiler that emits the bytes and the interpreter that reads them — and it
# is owned by neither. Everything else is generated from here; see README.md.
#
# Generated, do not edit by hand:
#   tools/opcodes.py      constants, sizes and layout, for the compiler
#   rom/src/opcodes.inc   the equates, for the interpreter
#
# An instruction is its opcode byte followed by `args`, in order. An opcode
# that ends in a variable number of entries declares `repeated`, and the `arg`
# that holds how many entries follow carries `count = "<name of the group>"`.
# Those are the only two shapes there are. If a new opcode does not fit, the
# answer is to change the opcode, not to grow this grammar: the moment this
# file can describe behaviour, it stopped being a declaration.
#
# Types: `byte` (1), `word` (2, little endian), `long` (3, little endian).
# `signed = true` says how to read it back; nothing writes it differently.


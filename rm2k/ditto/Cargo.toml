[package]
name = "ditto"
version = "0.1.0"
edition = "2021"
description = "Reads the RPG Maker 2000 files and dumps them to JSON, and back"

[lib]
name = "ditto"
path = "src/lib.rs"

[[bin]]
name = "ditto"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

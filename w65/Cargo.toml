[package]
name = "w65"
version = "0.1.0"
edition = "2021"
description = "A 65816 assembler that lays out a LoROM cartridge image without a separate linker"

[[bin]]
name = "w65"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
